<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Utir: set up your workspace</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-dark,.t-system{--bg:#000000;--surface:#181818;--surface-2:#1F1F1F;--surface-3:#272727;--surface-4:#313131;--line:#272727;--line-strong:#313131;--fg:#F5F5F7;--fg-2:#A1A1A6;--fg-3:#8E8E93;--btn-bg:#F5F5F7;--btn-fg:#000000;--chart:#C7C7CC;--green:#30D158;--red:#FF6961;--orange:#FFB340;--blue:#64D2FF;--danger-line:#3A2020;color-scheme:dark}
.t-light{--bg:#F5F5F7;--surface:#FFFFFF;--surface-2:#F2F2F4;--surface-3:#E8E8ED;--surface-4:#DCDCE1;--line:#E5E5EA;--line-strong:#D2D2D7;--fg:#1D1D1F;--fg-2:#515154;--fg-3:#6E6E73;--btn-bg:#1D1D1F;--btn-fg:#FFFFFF;--chart:#8E8E93;--green:#1A7F37;--red:#C9001A;--orange:#A84B00;--blue:#0062C4;--danger-line:#F2C4C1;color-scheme:light}
@media (prefers-color-scheme: light){.t-system{--bg:#F5F5F7;--surface:#FFFFFF;--surface-2:#F2F2F4;--surface-3:#E8E8ED;--surface-4:#DCDCE1;--line:#E5E5EA;--line-strong:#D2D2D7;--fg:#1D1D1F;--fg-2:#515154;--fg-3:#6E6E73;--btn-bg:#1D1D1F;--btn-fg:#FFFFFF;--chart:#8E8E93;--green:#1A7F37;--red:#C9001A;--orange:#A84B00;--blue:#0062C4;--danger-line:#F2C4C1;color-scheme:light}}
.logo-light{display:none}.t-light .logo-dark{display:none}.t-light .logo-light{display:block}
@media (prefers-color-scheme: light){.t-system .logo-dark{display:none}.t-system .logo-light{display:block}}

a{color:var(--fg)}a:hover{opacity:.8}
.btn{transition:transform 300ms cubic-bezier(0.22,1,0.36,1),opacity 300ms cubic-bezier(0.22,1,0.36,1);cursor:pointer}
.btn:hover{opacity:.88}.btn:active{transform:scale(.98)}
.btn:focus-visible,.field:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.field::placeholder{color:var(--fg-3)}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>
</helmet>
<main class="{{themeClass}}" style="min-height: 100vh; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px; gap: 32px">
  <img class="logo-dark" src="./assets/314e2e750f0551a6a57b030ba132d194.svg" alt="Utir" style="height: 40px; width: auto"><img class="logo-light" src="./assets/4c03c898973e66979b997f421da99055.svg" alt="Utir" style="height: 40px; width: auto">
  <section style="width: 100%; max-width: 440px; box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 40px 32px 32px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
      <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em">Name your workspace</h1>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--fg-2)">Your apps, keys and the people you share with live here. You can rename it later.</p>
    </div>
    <form style="display: flex; flex-direction: column; gap: 12px; margin: 0">
      <label for="ws-name" style="font-size: 13px; line-height: 16px; font-weight: 500; color: var(--fg-2)">Workspace name</label>
      <input class="field" id="ws-name" type="text" value="Fenil's workspace" autocomplete="organization" style="height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); padding: 0 16px; font: 400 15px/20px Geist, system-ui, sans-serif">
      <a class="btn" href="AppsList.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: var(--btn-bg); color: var(--btn-fg); font: 600 14px/20px Geist, system-ui, sans-serif; text-decoration: none; margin-top: 4px">Continue</a>
    </form>
    <div style="display: flex; align-items: center; gap: 12px; color: var(--fg-3); font-size: 12px; line-height: 16px">
      <span style="flex: 1; height: 1px; background: var(--surface-3)"></span>or join one you were invited to<span style="flex: 1; height: 1px; background: var(--surface-3)"></span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <li style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--surface-2)">
        <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: var(--surface-4); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">D</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 20px; font-weight: 500">Design team</span><span style="font-size: 12px; line-height: 16px; color: var(--fg-3)">Invited by maya@example.com</span></span>
        <button class="btn" type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); font: 500 13px/16px Geist, system-ui, sans-serif">Join</button>
      </li>
    </ul>
  </section>
  <div role="group" aria-label="Appearance" style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--surface); width: 100%; max-width: 280px; box-sizing: border-box"><button class="btn" type="button" aria-pressed="{{darkPressed}}" onClick="{{pickDark}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 0; background: {{darkBg}}; color: {{darkFg}}; font: 500 12px/16px Geist, system-ui, sans-serif"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path></svg>Dark</button><button class="btn" type="button" aria-pressed="{{lightPressed}}" onClick="{{pickLight}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 0; background: {{lightBg}}; color: {{lightFg}}; font: 500 12px/16px Geist, system-ui, sans-serif"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Light</button><button class="btn" type="button" aria-pressed="{{systemPressed}}" onClick="{{pickSystem}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 0; background: {{systemBg}}; color: {{systemFg}}; font: 500 12px/16px Geist, system-ui, sans-serif"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>System</button></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","system"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = (this.state && this.state.theme) || this.props.theme || 'dark';
    const pick = (t) => () => this.setState({ theme: t });
    const v = {};
    ['dark', 'light', 'system'].forEach((t) => {
      v[t + 'Bg'] = theme === t ? 'var(--surface-4)' : 'transparent';
      v[t + 'Fg'] = theme === t ? 'var(--fg)' : 'var(--fg-2)';
      v[t + 'Pressed'] = theme === t ? 'true' : 'false';
    });
    return Object.assign(v, { themeClass: 't-' + theme, pickDark: pick('dark'), pickLight: pick('light'), pickSystem: pick('system') });
  }
}
</script>
</body>
</html>
